version: '3.8'

services:
  agenthire:
    build: .
    container_name: agenthire-app
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-oss-20b}
      - API_BASE_URL=http://127.0.0.1:8000
    volumes:
      - ./data:/app/data
    restart: always
